services:
  rota-postgres:
    image: postgres:16-alpine
    container_name: rota-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rota}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rota_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rota"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rota_pgdata:
    name: rota_pgdata
